name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Postgres 16, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: docker compose run --rm --build --no-deps tests mypy
      - name: Test suite
        run: docker compose run --rm tests pytest -q
      - name: Build and check package
        run: docker compose run --rm --no-deps tests sh -c "python -m build && twine check dist/*"

  install:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Import and run the CLI
        run: |
          python -c "import durably; print(durably.__version__)"
          durably --help
