[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "durably"
version = "0.1.0.dev0"
description = "Durable execution for AI agents, with just Postgres."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tarang802" }]
keywords = ["durable execution", "workflow", "ai agents", "llm", "postgres", "asyncio"]
dependencies = ["asyncpg>=0.30"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tarang802/Durable-agent-runtime"
Repository = "https://github.com/tarang802/Durable-agent-runtime"
Issues = "https://github.com/tarang802/Durable-agent-runtime/issues"
Changelog = "https://github.com/tarang802/Durable-agent-runtime/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.112", "mypy>=1.13", "build>=1.2", "twine>=6.0"]

[project.scripts]
durably = "durably.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/durably"]

[tool.hatch.build.targets.sdist]
include = ["src/durably", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["durably"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
